services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ai_policy
      MYSQL_USER: ai_policy
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    # 不对外暴露 3306：数据库只允许 backend 容器内网访问

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_ENABLED: "1"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ai_policy
      DB_USER: ai_policy
    ports:
      - "8000:8000"        # 浏览器访问 http://服务器IP:8000/ ；想走 80 改成 "80:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
