<style>
/* ==== tokens.css ==== */
/* ============================================================
   设计令牌层 —— 取自 Ardot 设计稿（交互原型页）
   使用处一律只写 var(--x)，不散落十六进制
   ============================================================ */
:root{
  /* 品牌 */
  --brand:#014DB2;
  --brand-600:#0A5FC4;
  --brand-deep:#001645;
  --brand-link:#1D4ED8;

  /* 文字 */
  --ink:#0A1628;          /* 标题 */
  --text:#303133;         /* 正文 */
  --text-2:#18191C;       /* 次级正文 */
  --muted:#6B7280;        /* 辅助 */
  --placeholder:#9AA0A6;  /* 占位 */
  --on-brand:#FFFFFF;

  /* 线与面 */
  --border:#E5E7EB;
  --border-2:#C9CDD4;
  --border-soft:#EBEEF2;
  --bg:#F9F9F9;
  --bg-2:#F2F4F7;
  --bg-3:#F7F8FA;
  --bg-4:#F5F8FD;
  --card:#FFFFFF;
  --line:#E7E7E7;

  /* 浅蓝 */
  --blue-50:#DEEAFB;
  --blue-50b:#EAF1FB;
  --blue-50c:#ECF5FF;
  --blue-100:#E9F0FB;

  /* 语义：待核验 */
  --warn-bg:#FEF3C7;
  --warn-fg:#B4520A;
  --warn-bd:#FDE68A;
  --warn-dot:#D97706;

  /* 语义：成功 */
  --ok:#10B981;
  --ok-fg:#047857;
  --ok-bg:#ECFDF5;
  --ok-bd:#A7F3D0;

  /* 语义：错误 */
  --danger:#DC2626;
  --danger-fg:#B91C1C;
  --danger-bg:#FEF2F2;
  --danger-bd:#FECACA;

  /* 语义：橙（截止提醒） */
  --orange:#EA580C;
  --orange-bg:#FFF7EE;

  /* 圆角 */
  --r-1:4px; --r-2:6px; --r-3:8px; --r-4:10px; --r-5:12px; --r-6:14px; --r-full:999px;

  /* 阴影 */
  --sh-1:0 1px 2px rgba(10,22,40,.05);
  --sh-2:0 4px 14px rgba(10,22,40,.06);
  --sh-3:0 10px 28px -6px rgba(1,77,178,.14);
  --sh-4:0 18px 48px -12px rgba(10,22,40,.18);

  /* 字体 */
  --font-cn:"Noto Sans SC","PingFang SC","Microsoft YaHei","Source Han Sans SC",sans-serif;
  --font-en:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;

  /* 原型外壳（工具层，非设计还原物） */
  --shell-bg:#20242C;
  --shell-fg:#C7CCD6;
  --shell-active:#014DB2;
}

/* ---------- 基础重置 ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-cn);
  color:var(--text);
  background:var(--shell-bg);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font-family:inherit;font-size:inherit;color:inherit}
ul,ol{margin:0;padding:0;list-style:none}
h1,h2,h3,h4,p{margin:0}
a{color:var(--brand-link);text-decoration:none}
table{border-collapse:collapse;border-spacing:0}
.num{font-family:var(--font-en);font-variant-numeric:tabular-nums}

/* 滚动条（屏内滚动区） */
.scroll{overflow:auto;scrollbar-width:thin;scrollbar-color:#CBD2DB transparent}
.scroll::-webkit-scrollbar{width:8px;height:8px}
.scroll::-webkit-scrollbar-thumb{background:#CBD2DB;border-radius:var(--r-full)}
.scroll::-webkit-scrollbar-thumb:hover{background:#AEB7C2}
.scroll::-webkit-scrollbar-track{background:transparent}

/* ==== shell.css ==== */
/* ============================================================
   原型外壳 —— 画布缩放 / 通知与 Toast / 空态
   （属于工具层，不属于设计还原物）
   ------------------------------------------------------------
   外壳不占任何画面：屏索引条与左下角画布缩放胶囊都已移除，
   各屏入口统一收进产品自己的顶栏导航（data/app.json → nav）；
   画布恒定按窗口等比铺满（原「适应窗口」，不再提供「实际尺寸」切换）。
   构建戳仍在 window.__BUILD__（build.py 写入），需要时开控制台读。
   ============================================================ */
body{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- 画布视口 ----------
   视口底色直接取页面自己的 --bg，画布去掉圆角与投影、也不留内边距 ——
   于是应用就是整页本身，四周看不到任何框。
   （等比缩放仍在：窗口比 16:10 更宽时左右留白，更窄时上下留白，
     而留白与页面同色，所以视觉上仍是「一整个页面」。） */
.proto-viewport{
  flex:1;min-height:0;overflow:auto;display:flex;justify-content:center;align-items:flex-start;
  background:var(--bg);
}
.proto-viewport.center{align-items:center}
.proto-stage{position:relative;flex:0 0 auto}
.proto-canvas{
  position:absolute;top:0;left:0;width:1440px;height:900px;overflow:hidden;
  background:var(--bg);
  transform-origin:top left;
}

/* ---------- 屏幕容器 ---------- */
.screen{
  position:relative;
  width:1440px;height:900px;display:flex;flex-direction:column;
  background:var(--bg);color:var(--text);overflow:hidden;
}
.screen-body{flex:1;min-height:0;display:flex;flex-direction:column}

/* ---------- Toast ---------- */
.toast-layer{position:fixed;right:24px;bottom:24px;z-index:200;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.toast{
  display:flex;align-items:flex-start;gap:10px;max-width:420px;
  padding:12px 16px;border-radius:var(--r-4);background:var(--card);
  border:1px solid var(--border);box-shadow:var(--sh-4);
  font-size:13px;line-height:1.5;color:var(--text-2);
  animation:toast-in .24s cubic-bezier(.2,.8,.3,1);
}
.toast.out{animation:toast-out .22s ease forwards}
.toast .ic{flex:0 0 auto;width:18px;height:18px;border-radius:var(--r-full);display:grid;place-items:center;margin-top:1px}
.toast.ok .ic{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.toast.warn .ic{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.toast.danger .ic{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-bd)}
.toast.info .ic{background:var(--blue-50b);color:var(--brand);border:1px solid var(--blue-50)}
.toast b{color:var(--ink);font-weight:600}
/* 通知卡片：右下角同一条队列里，比 toast 更实（标题 + 说明 + 操作） */
.toast.notice{align-items:center;gap:12px;max-width:520px;padding:14px 16px}
.toast.notice .ic{margin-top:0;width:22px;height:22px}
.toast.notice .nt-main{flex:1;min-width:0}
.toast.notice .nt-ttl{font-size:13px;font-weight:600;color:var(--ink)}
.toast.notice .nt-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.55;word-break:break-word}
.toast.notice .nt-acts{display:flex;gap:6px;flex:0 0 auto;align-items:center}
@keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(6px)}}

/* ---------- 空态 ---------- */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:44px 24px;border:1px dashed var(--border-2);border-radius:var(--r-5);
  background:var(--card);text-align:center;
}
.empty .em-ic{width:44px;height:44px;border-radius:var(--r-full);background:var(--blue-50b);display:grid;place-items:center;color:var(--brand)}
.empty h4{font-size:14px;font-weight:600;color:var(--ink)}
.empty p{font-size:12px;color:var(--muted);max-width:520px;line-height:1.6}
.empty .em-acts{display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;justify-content:center}

/* ==== app.css ==== */
/* ============================================================
   产品 UI —— 通用组件（顶栏 / 按钮 / 徽标 / 芯片 / 卡片 / 提示条）
   ============================================================ */

/* ---------- 产品顶栏（HF/顶栏 1:1 还原） ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  height:64px;padding:0 24px;background:var(--card);border-bottom:1px solid #EAEAEA;
}
.tb-logo{display:flex;align-items:center;gap:10px;flex:0 0 auto;white-space:nowrap}
.tb-logo .mark{
  width:32px;height:32px;border-radius:var(--r-3);display:grid;place-items:center;
  background:linear-gradient(135deg,#001745 0%,#014DB3 100%);
}
.tb-logo .mark svg{display:block}
.tb-name{font-size:15px;font-weight:600;color:var(--ink);white-space:nowrap}
.tb-pill{
  height:22px;padding:0 8px;border-radius:var(--r-full);background:var(--bg-2);
  font-size:11px;color:var(--muted);display:inline-flex;align-items:center;
  flex:0 0 auto;white-space:nowrap;
}
.tb-spacer{flex:1;min-width:0}
/* 9 项导航：空间不够时让导航自己横向滚动，而不是把 logo / 状态胶囊挤成两行 */
.tb-nav{
  display:flex;align-items:center;gap:4px;flex:0 1 auto;min-width:0;
  overflow-x:auto;scrollbar-width:none;
}
.tb-nav::-webkit-scrollbar{display:none}
.tb-nav button{
  flex:0 0 auto;
  height:32px;padding:0 12px;border-radius:var(--r-full);
  font-size:13px;color:var(--muted);transition:background .15s,color .15s;white-space:nowrap;
}
.tb-nav button:hover{background:var(--bg-3);color:var(--text)}
.tb-nav button.on{background:var(--blue-50b);color:var(--brand);font-weight:500}
/* 闸门未开（未登录且未选游客身份）：站在登录页上时产品导航置灰，避免「点了没反应」 */
.tb-nav button:disabled{opacity:.4;cursor:not-allowed}
.tb-nav button:disabled:hover{background:transparent;color:var(--muted)}
/* 后台检索中：顶栏进度胶囊，任意屏可见，点它回到检索屏（不会重新发起检索） */
.tb-run-slot{display:inline-flex;align-items:center;flex:0 0 auto}
.tb-run{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;
  border-radius:var(--r-full);background:var(--blue-50b);color:var(--brand);
  font-size:12px;font-weight:500;white-space:nowrap;transition:background .15s;
}
.tb-run:hover{background:var(--blue-50)}
.tb-run b{font-family:var(--font-en);font-size:11px;font-weight:600}
.tb-run .spin{width:12px;height:12px;border-width:2px;border-color:rgba(1,77,178,.25);border-top-color:var(--brand)}
.tb-status{
  display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 8px;
  border-radius:var(--r-full);background:var(--ok-bg);font-size:12px;color:var(--ok-fg);
  flex:0 0 auto;white-space:nowrap;
}
.tb-status .dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--ok)}
.tb-status.off{background:var(--warn-bg);color:var(--warn-fg);cursor:pointer}
.tb-status.off .dot{background:var(--warn-dot)}
/* 检索进行中：让位给「检索中 n%」胶囊（作者样式会盖掉 UA 的 [hidden]{display:none}，需显式写） */
.tb-status[hidden]{display:none}

/* ---------- 按钮 ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:36px;padding:0 16px;border-radius:var(--r-3);
  font-size:13px;font-weight:500;white-space:nowrap;
  border:1px solid transparent;transition:.15s;user-select:none;
}
.btn-sm{height:30px;padding:0 12px;font-size:12px;border-radius:var(--r-2)}
.btn-lg{height:44px;padding:0 22px;font-size:14px;border-radius:var(--r-full)}
.btn-primary{background:linear-gradient(90deg,#003D8F 0%,#014DB3 100%);color:var(--on-brand)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-primary:disabled{opacity:.55;cursor:not-allowed;filter:none}
.btn-solid{background:var(--brand);color:var(--on-brand)}
.btn-solid:hover{background:var(--brand-600)}
.btn-outline{background:var(--card);border-color:var(--border-2);color:#4B5563}
.btn-outline:hover{border-color:var(--brand);color:var(--brand)}
.btn-ghost{background:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--bg-2);color:var(--text)}
.btn-link{height:auto;padding:0;color:var(--brand-link);font-weight:400}
.btn-link:hover{text-decoration:underline}
.btn[disabled],.btn.is-busy{pointer-events:none;opacity:.6}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.spin.dark{border-color:rgba(1,77,178,.25);border-top-color:var(--brand)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 徽标 / 标签 ---------- */
.badge{
  display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;
  border-radius:var(--r-1);font-size:11px;line-height:1;white-space:nowrap;
}
.badge-warn{background:var(--warn-bg);color:var(--warn-fg);border:1px solid var(--warn-bd)}
.badge-ok{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.badge-danger{background:var(--danger-bg);color:var(--danger-fg);border:1px solid var(--danger-bd)}
.badge-info{background:var(--blue-50b);color:var(--brand);border:1px solid var(--blue-50)}
.badge-plain{background:var(--bg-2);color:var(--muted)}
.badge-orange{background:var(--orange-bg);color:var(--orange);border:1px solid #FED7AA}
.badge-lg{height:24px;padding:0 9px;font-size:12px;border-radius:var(--r-2)}

/* 层级标签（市级/省级/区县级） */
.lvl{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:var(--r-1);
  font-size:11px;background:var(--blue-50b);color:var(--brand);border:1px solid var(--blue-50)}
.lvl.national,.lvl.nation{background:#FEF2F2;color:#B91C1C;border-color:#FECACA}
.lvl.province{background:#FFF7EE;color:#B4520A;border-color:#FDE68A}
.lvl.city{background:var(--blue-50b);color:var(--brand);border-color:var(--blue-50)}
.lvl.county{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.lvl.park{background:#F5F3FF;color:#6D28D9;border-color:#DDD6FE}

/* ---------- 芯片（示例 / 已选标签） ---------- */
.chips{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
  border:1px solid var(--border);border-radius:var(--r-full);
  font-size:13px;color:var(--muted);background:transparent;transition:.15s;
}
.chip:hover{border-color:var(--brand);color:var(--brand);background:var(--blue-50c)}
.chip.plain{background:var(--card)}

.tag{
  display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 6px;
  border-radius:var(--r-2);background:var(--blue-50b);color:var(--brand);font-size:12px;
}
.tag .x{
  width:14px;height:14px;border-radius:var(--r-full);display:grid;place-items:center;
  color:var(--brand);opacity:.65;font-size:12px;line-height:1;cursor:pointer;
}
.tag .x:hover{background:rgba(1,77,178,.14);opacity:1}
.tag.more{background:#F2F4F7;color:var(--muted);padding:0 8px;cursor:pointer}
.tag.more:hover{background:#E5E7EB}

/* ---------- 通用卡片 / 面板 ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r-6)}
.card-pad{padding:20px}
.sec-head{display:flex;align-items:center;gap:10px}
.sec-head h3{font-size:15px;font-weight:600;color:var(--ink)}
.sec-head .sub{font-size:12px;color:var(--muted)}
.sec-head .spacer{flex:1}

.hint{font-size:12px;color:var(--muted);line-height:1.6}
.mono-sm{font-size:11px;color:var(--placeholder)}

/* ---------- 提示条（banner） ---------- */
.banner{
  display:flex;align-items:flex-start;gap:12px;padding:14px 16px;
  border-radius:var(--r-4);font-size:13px;line-height:1.6;
}
/* ★ 作者样式 display:flex 会盖掉 UA 的 [hidden]{display:none}：
   断连横幅 #pipeConnLost 靠 hidden 控制显隐，不写这条就会「检索屏一出来就常亮黄条」。 */
.banner[hidden]{display:none}
.banner .bn-ic{flex:0 0 auto;width:20px;height:20px;border-radius:var(--r-full);display:grid;place-items:center;margin-top:1px}
.banner .bn-main{flex:1;min-width:0}
.banner .bn-ttl{font-weight:600;color:var(--ink);margin-bottom:2px}
.banner .bn-desc{color:var(--muted);font-size:12px}
.banner .bn-acts{flex:0 0 auto;display:flex;gap:8px;align-items:center}
.banner.warn{background:var(--warn-bg);border:1px solid var(--warn-bd)}
.banner.warn .bn-ic{background:#FDE68A;color:var(--warn-fg)}
.banner.danger{background:var(--danger-bg);border:1px solid var(--danger-bd)}
.banner.danger .bn-ic{background:#FECACA;color:var(--danger-fg)}
.banner.ok{background:var(--ok-bg);border:1px solid var(--ok-bd)}
.banner.ok .bn-ic{background:var(--ok-bd);color:var(--ok-fg)}
.banner.info{background:var(--blue-50c);border:1px solid #BFDBFE}
.banner.info .bn-ic{background:#BFDBFE;color:var(--brand-link)}

/* ---------- 状态点 ---------- */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:var(--r-full);background:currentColor}
.st.run{color:var(--brand)}
.st.run::before{animation:pulse 1.4s ease-in-out infinite}
.st.ok{color:var(--ok-fg)}
.st.fail{color:var(--danger-fg)}
.st.wait{color:var(--muted)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

/* ---------- 进度条 ---------- */
.bar{height:6px;border-radius:var(--r-full);background:var(--bg-2);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:var(--r-full);
  background:linear-gradient(90deg,#003D8F,#014DB3);transition:width .45s cubic-bezier(.4,0,.2,1)}

/* ---------- 键值行 ---------- */
.kv{display:flex;gap:8px;font-size:12px;line-height:1.5}
.kv .k{flex:0 0 auto;color:var(--placeholder);min-width:56px}
.kv .v{color:var(--text);min-width:0}
.kv .v b{color:var(--ink);font-weight:600}
.kv .v .arrow{color:var(--placeholder);margin:0 4px}

/* ---------- 分隔 ---------- */
.hr{height:1px;background:var(--line);border:0;margin:0}
.hr-v{width:1px;background:var(--line)}

/* ==== screens.css ==== */
/* ============================================================
   各屏布局
   ============================================================ */

/* ================= 1 · 首页检索 ================= */
.home-body{flex:1;min-height:0;display:flex;flex-direction:column}
.hero{display:flex;flex-direction:column;gap:14px;padding:40px 52px 26px}
.boot-pill{
  display:inline-flex;align-items:center;gap:8px;align-self:flex-start;height:30px;padding:0 12px;
  border-radius:var(--r-full);background:var(--card);border:1px solid #BFDBFE;
  font-size:12px;color:var(--brand-link);
}
.boot-pill .dot{width:8px;height:8px;border-radius:var(--r-full);background:var(--ok)}
.hero h1{font-size:38px;line-height:1.2;font-weight:700;color:var(--ink);letter-spacing:-.6px}
.hero .hero-sub{font-size:15px;color:var(--muted)}
.searchbox{
  display:flex;align-items:center;gap:10px;width:880px;height:64px;padding:0 10px 0 20px;
  background:var(--card);border:1px solid var(--brand);border-radius:var(--r-full);
  box-shadow:0 4px 18px -6px rgba(1,77,178,.22);
}
.searchbox svg{flex:0 0 auto;color:var(--placeholder)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px;color:var(--text)}
.searchbox input::placeholder{color:var(--placeholder)}
.searchbox .go{height:44px;padding:0 26px;border-radius:var(--r-full);font-size:14px}
.examples{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--placeholder)}

/* 条件栏 */
.filterpanel{margin:0 52px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-6);display:flex;flex-direction:column;gap:12px}
.filterpanel .fp-ttl{font-size:13px;color:var(--placeholder)}
.fp-row{display:flex;gap:12px}
.trigger{
  flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r-3);
  font-size:13px;color:var(--muted);cursor:pointer;transition:.15s;
}
.trigger:hover{border-color:var(--brand);background:var(--blue-50c)}
.trigger.active{border-color:var(--brand);background:var(--blue-50c);color:var(--text)}
/* 只读触发器（结果列表的地域回显）：它回答「这份结果是按什么地域检索出来的」，
   不是可填控件 —— 所以：不响应 hover、没有 caret / 清空 / ×、也不占满整行，
   收成一枚浅色胶囊，读起来像一句说明而不是一个下拉框。 */
.trigger.readonly{
  cursor:default;flex:0 0 auto;min-width:0;width:auto;
  height:auto;min-height:0;padding:5px 12px;gap:0;
  background:var(--bg-3);border:1px dashed var(--border-2);border-radius:var(--r-full);
  color:var(--text);
}
.trigger.readonly.active{border-style:solid;border-color:var(--border-2);background:var(--bg-3);color:var(--text)}
.trigger.readonly:hover{border-color:var(--border-2);background:var(--bg-3)}
/* 触发器内部：标签固定、值区可伸缩且裁切（四个维度同一套规则） */
.trigger .tv{flex:0 0 auto;white-space:nowrap}
.trigger .tv b{color:var(--ink);font-weight:500}
.trigger .tags{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden}
.trigger .ph{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--placeholder)}
.trigger .caret{flex:0 0 auto;color:var(--placeholder)}
.trigger .clear-slot{flex:0 0 auto;font-size:12px;color:var(--brand-link)}
.fp-summary{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.fp-summary b{color:var(--brand);font-weight:500}

/* ============================================================
   统一筛选控件 · 面板骨架（.fpanel）
   ------------------------------------------------------------
   地域 / 行业 / 类型 / 截止时间共用这一份骨架与同一组类名，
   维度差异只体现在「面板宽度 + 列表区排布」（见 .opt-panel / .casc-panel）。
   头部两行：① 标题 + 快捷操作；② 搜索框 + 生效时机提示。
   ============================================================ */
.trigger.open{border-color:var(--brand);background:var(--blue-50c);color:var(--text)}
/* 触发器要浮在选项面板遮罩（optLayer, z-index 45）之上：否则面板展开时点触发器
   只会命中遮罩，「再点一下收起」这个最直觉的操作就点不到了。
   （地域级联浮层更高（47）：它高 566，装不到触发器下方，会被夹上去盖住触发器，
   这一行就不能比它更低了 —— 见 app.js → PANEL_Z） */
.filterpanel .trigger,.filterbar .trigger{position:relative;z-index:46}

.fpanel{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);
  box-shadow:var(--sh-3);overflow:hidden;display:flex;flex-direction:column;
}
.fpanel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:0 0 auto}
.fpanel-head-top{display:flex;align-items:center;gap:10px}
.fp-ttl{font-size:12px;font-weight:600;color:var(--ink);flex:0 0 auto}
.fp-spacer{flex:1;min-width:0}
.fpanel-head-bar{display:flex;align-items:center;gap:10px}
.fp-hint{flex:0 1 auto;min-width:0;font-size:11px;color:var(--placeholder);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fp-act{
  height:22px;padding:0 10px;border-radius:var(--r-full);border:1px solid var(--border);
  background:var(--card);font-size:11px;color:var(--brand-link);cursor:pointer;flex:0 0 auto;
}
.fp-act:hover{border-color:var(--brand);background:var(--blue-50c)}
.fp-act.on{background:var(--blue-50b);border-color:var(--blue-50);color:var(--brand)}
.fp-search{
  flex:1 1 auto;min-width:120px;display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;
  background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r-3);
}
.fp-search svg{flex:0 0 auto;color:var(--placeholder)}
.fp-search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:12px}
.fp-search input::placeholder{color:var(--placeholder)}
.fpanel-body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.fpanel-foot{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#FAFBFC;border-top:1px solid var(--line);flex:0 0 auto}
.fpanel-foot .sum{flex:1;min-width:0;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fpanel-foot .sum b{color:var(--ink);font-weight:600}
.fpanel-empty{padding:18px 10px;font-size:12px;color:var(--placeholder);line-height:1.7}
/* 列表行：级联面板与选项面板共用 */
.frow{
  display:flex;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:var(--r-2);
  font-size:12px;color:var(--text);cursor:pointer;flex:0 0 auto;
}
.frow:hover{background:var(--bg-3)}
.frow.on{background:var(--blue-50b);color:var(--brand);font-weight:500}
.frow .box{
  width:14px;height:14px;border-radius:3px;border:1px solid var(--border-2);flex:0 0 auto;
  display:grid;place-items:center;color:#fff;
}
.frow.on .box{background:var(--brand);border-color:var(--brand)}
.frow .rn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .rc-count{font-size:11px;color:var(--placeholder);font-family:var(--font-en);flex:0 0 auto}
.frow.all{color:var(--brand);font-weight:500}

/* 行业 / 类型 / 截止时间：单列列表 */
.opt-panel{width:460px}
.opt-panel .fpanel-body{display:flex;flex-direction:column;gap:2px;padding:8px;max-height:280px;min-height:120px}

/* 能力卡 */
/* 原「蓝色降级横幅」在底部，靠 margin-top:auto 顶着；横幅移除后由能力卡接管这一位，
   免得首页底部留出一大片无意义的空白。 */
.caprow{display:flex;gap:20px;margin-top:auto;padding:22px 36px 28px}
.capcard{flex:1;min-width:0;padding:20px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-6);display:flex;flex-direction:column;gap:10px}
.capcard .ic{width:24px;height:24px;color:var(--brand)}
.capcard h4{font-size:15px;font-weight:600;color:var(--ink)}
.capcard p{font-size:12px;line-height:1.65;color:var(--muted)}

/* ================= 2 · 检索中（加载态） ================= */
/* ★ 整屏可滚：.screen 是定高 1440×900 + overflow:hidden，所以内容一旦超出就得
   在这里自己滚 —— 以前 .search-body 没有 overflow，多源抓取的日志一多，
   下面的日志与「取消检索」按钮直接被裁在画布外，用户滑不动、也够不着取消
   （2026-10-15 用户实测）。子项一律 flex:0 0 auto，否则 flex 容器会先把它们压扁
   而不是撑出滚动条，等于白给 overflow。 */
.search-body{flex:1;min-height:0;padding:44px 96px;display:flex;flex-direction:column;gap:22px;overflow-y:auto}
.search-body>*{flex:0 0 auto}
.search-echo{display:flex;flex-direction:column;gap:8px}
.search-echo .q{font-size:22px;font-weight:600;color:var(--ink);position:relative;cursor:help}
.search-echo .q span{color:var(--brand)}
/* 问句原文 tooltip：原生 title 要悬停 1~2s 才出现，几乎不可发现（TC-022）——
   改用 data-tip + 悬停即显的自绘气泡，问句再长也完整可读 */
.search-echo .q[data-tip]:hover::after{
  content:attr(data-tip);position:absolute;left:0;top:calc(100% + 8px);z-index:40;
  max-width:560px;padding:8px 12px;border-radius:8px;text-align:left;
  background:var(--ink);color:#fff;font-size:12px;font-weight:400;line-height:1.6;
  white-space:normal;box-shadow:0 8px 24px rgba(15,23,42,.18);
}
.parsed{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.parsed .pk{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--r-2);background:var(--blue-50b);color:var(--brand);font-size:12px}

.pipeline{display:flex;align-items:center;gap:0;padding:22px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-6)}
.step{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.step .sn{width:24px;height:24px;border-radius:var(--r-full);display:grid;place-items:center;flex:0 0 auto;font-size:11px;background:var(--bg-2);color:var(--placeholder);font-family:var(--font-en)}
.step .sl{font-size:12px;color:var(--placeholder);white-space:nowrap}
.step.done .sn{background:var(--ok-bg);color:var(--ok-fg);border:1px solid var(--ok-bd)}
.step.done .sl{color:var(--muted)}
.step.now .sn{background:var(--brand);color:#fff}
.step.now .sl{color:var(--ink);font-weight:500}
.step .line{flex:1;height:1px;background:var(--border);margin:0 8px;min-width:8px}
.step:last-child .line{display:none}

.progress-card{padding:22px 24px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-6);display:flex;flex-direction:column;gap:14px}
.progress-top{display:flex;align-items:baseline;gap:10px}
.progress-top .pt{font-size:15px;font-weight:600;color:var(--ink)}
.progress-top .pv{font-size:13px;color:var(--brand);font-family:var(--font-en)}
.progress-top .pc{margin-left:auto;font-size:12px;color:var(--placeholder)}
/* ★ 日志区自己限高滚动（不随条数无限长高）：抓 30+ 个源时，「取消检索」按钮
   始终留在屏内，历史日志也能往回翻。跟滚只发生在用户本就贴着底部时（见
   screens-a.js 的 paintSearchScreen）—— 否则他正翻历史，新来一条就把他拽回底部。 */
.loglist{display:flex;flex-direction:column;gap:0;max-height:300px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#CBD2DB transparent;padding-right:4px}
.loglist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--border-soft);font-size:12px;color:var(--muted);animation:fade-up .3s ease both}
.loglist li:first-child{border-top:0}
.loglist li .lt{font-family:var(--font-en);color:var(--placeholder);flex:0 0 auto}
.loglist li .ls{flex:1;min-width:0;color:var(--text)}
.loglist li .lr{flex:0 0 auto;color:var(--placeholder);font-family:var(--font-en)}
@keyframes fade-up{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ================= 3 · 结果列表 ================= */
.list-body{flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 32px 0;gap:14px}
/* 页头一行里塞三样：长标题 + 口径统计 + 工具条。条件一长（如一次选了 17 个区县），
   默认 flex 会把工具条一路挤窄 —— 「排序：发布时间（最新优先）」被压成一列一个字。
   这里把弹性交给标题（可缩、最多两行，超出省略），统计与工具条一律不收缩、文字不换行；
   实在放不下就让工具条整体换到下一行，绝不把按钮挤变形。 */
.list-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.list-head h2{font-size:18px;font-weight:600;color:var(--ink);flex:1 1 320px;min-width:0;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.list-head .meta{font-size:12px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.list-tools{display:flex;align-items:center;gap:8px;margin-left:auto;flex:0 0 auto}
.select-like{
  display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;white-space:nowrap;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-3);font-size:13px;color:var(--text);
  cursor:pointer;transition:.15s;
}
.select-like:hover{border-color:var(--brand);color:var(--brand)}

/* ---------- 结果列表：排序下拉 ----------
   菜单常驻 DOM、用 `.sortwrap.open` 控显隐（展开 / 收起不重渲染，见 screens-b.js）。 */
.sortwrap{position:relative}
.sortwrap.open .select-like{border-color:var(--brand);color:var(--brand);background:var(--blue-50c)}
.sortwrap .select-like .caret svg{transition:transform .15s}
.sortwrap.open .select-like .caret svg{transform:rotate(180deg)}
.sortmenu{
  display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:60;
  width:308px;padding:6px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-4);box-shadow:var(--sh-4);
}
.sortwrap.open .sortmenu{display:block}
.sortopt{
  display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;text-align:left;
  border-radius:var(--r-3);background:transparent;color:var(--text);cursor:pointer;transition:.12s;
}
.sortopt:hover{background:var(--bg-3)}
.sortopt.on{background:var(--blue-50c)}
.sortopt .so-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.sortopt .so-t{font-size:13px;font-weight:500;color:var(--ink)}
.sortopt.on .so-t{color:var(--brand)}
.sortopt .so-h{font-size:11px;line-height:1.5;color:var(--placeholder)}
.sortopt .so-c{flex:0 0 auto;width:16px;height:16px;display:grid;place-items:center;color:var(--brand)}
.sortopt .so-c:empty{visibility:hidden}

/* ---------- 结果列表：卡片 / 表格 两种视图 ---------- */
.viewseg{display:flex;gap:6px}
.viewseg .btn.on{border-color:var(--brand);color:var(--brand);background:var(--blue-50c)}
.result-table{
  flex:1;min-height:0;padding-right:4px;background:var(--card);
  border:1px solid var(--border);border-radius:var(--r-5);
}
.result-table table{width:100%;border-collapse:separate;border-spacing:0}
.result-table thead th{
  position:sticky;top:0;z-index:2;background:var(--bg-3);
  padding:10px 12px;text-align:left;white-space:nowrap;
  font-size:11px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--border);
}
.result-table tbody td{
  padding:11px 12px;font-size:12px;color:var(--text);
  border-bottom:1px solid var(--border-soft);vertical-align:middle;
}
.result-table tbody tr:last-child td{border-bottom:0}
.result-table tbody tr:hover td{background:var(--bg-4)}
.result-table tbody tr.picked td{background:#FCFDFF}
.result-table .rt-pick{width:38px;padding-right:0}
.result-table .rt-name{min-width:300px}
.result-table .rt-n{display:block;font-size:13px;font-weight:600;line-height:1.45;color:var(--ink);cursor:pointer}
.result-table .rt-n:hover{color:var(--brand)}
.result-table .rt-sub{display:block;margin-top:3px;font-size:11px;color:var(--placeholder)}
.result-table .rt-types{white-space:nowrap}
.result-table .rt-subsidy{min-width:170px}
.result-table .urgent{color:var(--warn-fg);font-weight:600}
.filterbar{padding:14px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);display:flex;flex-direction:column;gap:10px}
.filterbar .fb-row{display:flex;align-items:center;gap:12px}
.filterbar .fb-label{font-size:12px;color:var(--placeholder);flex:0 0 auto}
.filterbar .fb-hint{font-size:11px;color:var(--placeholder)}
.filterbar .fb-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.filterbar .trigger{flex:0 1 480px;min-width:320px}
/* 只读回显不撑满整行，收成胶囊（.filterbar .trigger 的特异性更高，必须在这里压） */
.filterbar .trigger.readonly{flex:0 0 auto;min-width:0;width:auto}

.listhead-row{display:flex;align-items:center;gap:12px;padding:0 4px;font-size:12px;color:var(--muted)}
.listhead-row .spacer{flex:1}
.checkbox{width:16px;height:16px;border-radius:var(--r-1);border:1px solid var(--border-2);background:#fff;display:grid;place-items:center;flex:0 0 auto;cursor:pointer}
.checkbox.on{background:var(--brand);border-color:var(--brand);color:#fff}
.checkbox svg{width:10px;height:10px}

.result-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.result-card{
  position:relative;padding:16px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:var(--r-5);display:flex;flex-direction:column;gap:10px;transition:.15s;cursor:pointer;
}
.result-card:hover{border-color:var(--brand);box-shadow:var(--sh-2)}
.result-card.picked{border-color:var(--brand);background:#FCFDFF}
.rc-top{display:flex;align-items:flex-start;gap:10px}
.rc-name{font-size:15px;font-weight:600;color:var(--ink);line-height:1.4}
.rc-name:hover{color:var(--brand)}
.rc-badges{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.rc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.rc-meta .sep{color:var(--border-2)}
.rc-kv{display:flex;gap:10px;flex-wrap:wrap}
.rc-kv .item{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.rc-kv .item .k{color:var(--placeholder);flex:0 0 auto}
.rc-kv .item .v{color:var(--text)}
.rc-kv .item .v b{color:var(--ink);font-weight:600}
.rc-foot{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--placeholder);border-top:1px dashed var(--border-soft);padding-top:10px}
.rc-foot .spacer{flex:1}
.rc-corner{
  position:absolute;right:0;top:0;height:24px;padding:0 10px 0 12px;display:flex;align-items:center;
  border-radius:0 var(--r-5) 0 var(--r-5);background:var(--orange-bg);color:var(--orange);
  font-size:11px;font-family:var(--font-en);
}
.pager{display:flex;align-items:center;gap:10px;padding:12px 0 16px;font-size:12px;color:var(--muted)}
.pager .spacer{flex:1}
.pager .pg{width:26px;height:26px;border-radius:var(--r-2);display:grid;place-items:center;border:1px solid var(--border);background:#fff;font-family:var(--font-en);font-size:12px;color:var(--text);cursor:pointer}
.pager .pg.on{background:var(--brand);border-color:var(--brand);color:#fff}
.pager .pg-nav{width:auto;padding:0 8px;font-family:var(--font-cn);font-size:12px;gap:2px}
.pager .pg:hover:not(.on):not(:disabled){border-color:var(--brand);color:var(--brand)}
.pager .pg:disabled{opacity:.42;cursor:not-allowed}
.pager .pg-dots{color:var(--placeholder);letter-spacing:1px}

/* ================= 3b · 对比浮层 ================= */
.cmp-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:70;
  display:flex;align-items:center;justify-content:center;padding:40px}
.cmp-panel{width:min(1080px,100%);max-height:100%;display:flex;flex-direction:column;
  background:#fff;border-radius:var(--r-3);border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(15,23,42,.24);overflow:hidden}
.cmp-head{display:flex;align-items:flex-start;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border)}
.cmp-title h3{font-size:15px;font-weight:600;color:var(--text)}
.cmp-title p{margin-top:4px;font-size:12px;color:var(--muted)}
.cmp-head .btn{margin-left:auto;flex:0 0 auto}
.cmp-body{overflow:auto;padding:0 20px 16px}
.cmp-table{width:100%;border-collapse:collapse;font-size:12px}
.cmp-table th,.cmp-table td{padding:10px 12px;border-bottom:1px solid var(--border);
  text-align:left;vertical-align:top;line-height:1.6}
.cmp-table thead th{position:sticky;top:0;z-index:1;background:#fff;
  border-bottom:1px solid var(--border);font-weight:600;color:var(--text);min-width:180px}
.cmp-table thead th.cmp-f{min-width:110px;font-weight:500;color:var(--muted)}
.cmp-table thead th .lvl{margin-right:6px}
.cmp-table th[scope="row"]{background:var(--slate-50,#F8FAFC);font-weight:500;color:var(--muted);min-width:110px}
.cmp-table tr.diff td{background:#FFFDF5}
.cmp-lb{display:block}
.cmp-tag{display:inline-block;margin-top:4px;padding:0 6px;height:17px;line-height:17px;
  border-radius:var(--r-1);font-size:10px}
.cmp-tag.diff{background:#FEF3C7;color:#92400E}
.cmp-tag.same{background:var(--slate-100,#F1F5F9);color:var(--placeholder)}

/* 「检索记录 / 对话记录」页签：同一屏来回切（用户反馈：想看上次的问答得先找到那条政策，太麻烦） */
.hist-tabs{display:flex;align-items:center;gap:8px;margin:10px 0 2px}
.hist-tabs .htab{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;
  border:1px solid var(--border);border-radius:var(--r-full);background:var(--card);
  font-size:12px;color:var(--muted);cursor:pointer}
.hist-tabs .htab svg{flex:0 0 auto}
.hist-tabs .htab:hover{border-color:var(--brand);color:var(--brand)}
.hist-tabs .htab.on{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.hist-tabs .htab-hint{margin-left:6px;font-size:11px;color:var(--placeholder)}
.thread-card{cursor:pointer}
.thread-card:hover{border-color:var(--brand)}
.thread-card .hc-q{cursor:pointer}

/* ================= 4 · 政策详情 ================= */
/* ★ 整页滚动，不做「左右各滚各的」：
   ① .screen 是定高 1440×900 + overflow:hidden，内容一旦超过就得有地方滚；
   ② 只有左栏自己滚的话，**鼠标悬在右栏对话面板上时滚轮完全无效**（右栏不是
      左栏的子元素，滚动链传不过去）—— 用户实测「这几个都没往下滑」；
   ③ 样例数据下内容常常「刚好塞满」，内层滚动条根本不出现，用户也发现不了能滚。
   所以滚动容器是 .detail-body（左右两栏的公共父级），滚轮落在详情页任何位置都有效；
   右栏对话面板用 sticky 钉在可视区内，滚动时始终可见可问。 */
.detail-body{flex:1;min-height:0;display:flex;gap:20px;padding:16px 32px 20px;overflow-y:auto}
.detail-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px}
/* ★ 左栏子块一律不许收缩：.fieldbox 自带 overflow:hidden，一旦被 flex 压扁，
   内容就在每个块内部被裁掉（用户实拍「申报流程 / 申报材料切半」），而且压扁后
   scrollHeight == clientHeight、根本无物可滚 —— 用户说的「没往下滑」就是它。
   不收缩 → 内容自然撑高 → 溢出交给 .detail-body 整页滚。 */
.detail-main > *{flex:0 0 auto}
.crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--placeholder)}
.crumb a{color:var(--muted)}
/* 返回按钮 + 面包屑同行：返回靠左，面包屑跟在后面作位置说明 */
.detail-topline{display:flex;align-items:center;gap:14px}
.detail-back{display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.detail-title{font-size:22px;font-weight:700;color:var(--ink);line-height:1.35}
.detail-tags{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.qa-row{display:flex;gap:12px}
.qa{flex:1;min-width:0;padding:14px 16px;border-radius:var(--r-4);background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.qa .qk{font-size:12px;color:var(--placeholder)}
.qa .qv{font-size:14px;font-weight:600;color:var(--ink)}
.qa .qv em{font-style:normal;color:var(--brand)}
.fieldbox{background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);overflow:hidden}
.fieldbox > header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFCFD}
.fieldbox > header h3{font-size:14px;font-weight:600;color:var(--ink)}
.fieldbox > header .spacer{flex:1}
.fieldbox .fbody{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.clause{display:flex;gap:10px;font-size:13px;line-height:1.6;color:var(--text)}
.clause .idx{flex:0 0 auto;width:18px;height:18px;margin-top:2px;border-radius:var(--r-full);background:var(--blue-50b);color:var(--brand);font-size:11px;display:grid;place-items:center;font-family:var(--font-en)}
.clause.target{background:#FFFCF0;border:1px solid var(--warn-bd);border-radius:var(--r-3);padding:10px 12px;margin:-4px -6px}
.clause .cw{flex:1;min-width:0}
.clause .cmeta{display:flex;align-items:center;gap:6px;margin-top:6px}
.matlist li{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.6;color:var(--text);padding:4px 0}
.matlist li::before{content:"";width:5px;height:5px;border-radius:var(--r-full);background:var(--brand);margin-top:8px;flex:0 0 auto}

/* ---------- 右栏：问政策 · AI 对话 ----------
   （原来的 .srcpanel「原文快照 · 字段级溯源」整体让位给对话，
     快照内容搬进 .snapdlg 弹层 —— 溯源能力没丢，只是换了容器） */
/* 右栏对话面板：sticky 钉住 —— 左栏内容随整页滚动，面板始终可见可问。
   align-self:flex-start 别拉伸成「整页那么高」，height:100% = 滚动可视区高度。 */
.chatpanel{flex:0 0 420px;align-self:flex-start;position:sticky;top:0;height:100%;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);
  display:flex;flex-direction:column;overflow:hidden}
.chatpanel > header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);background:#FCFCFD}
.chatpanel > header h3{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--ink)}
.chatpanel > header h3 svg{color:var(--brand);flex:0 0 auto}
.chatpanel > header .spacer{flex:1}
.cp-sub{padding:8px 14px 0;font-size:11px;line-height:1.6;color:var(--placeholder)}
.cp-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:12px 14px}
.cp-foot{display:flex;align-items:flex-end;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#FCFCFD}
.cp-in{flex:1;min-width:0;height:36px;max-height:96px;padding:9px 10px;border:1px solid var(--border-2);border-radius:var(--r-3);background:#fff;font-size:13px;line-height:1.5;resize:none;outline:none}
.cp-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(1,77,178,.1)}
.cp-in::placeholder{color:var(--placeholder)}
.cp-send{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;height:36px}
.cp-guest{display:flex;align-items:center;gap:4px;flex-wrap:wrap;margin:0 12px 8px;padding:8px 10px;border-radius:var(--r-3);background:var(--warn-bg);border:1px solid var(--warn-bd);font-size:11px;line-height:1.6;color:var(--warn-fg)}
.cmsg{max-width:92%;font-size:13px;line-height:1.7}
.cmsg .cm-body{padding:9px 11px;border-radius:var(--r-4);background:var(--bg-2);color:var(--text);word-break:break-word}
.cmsg.me{align-self:flex-end}
.cmsg.me .cm-body{background:var(--brand);color:var(--on-brand)}
.cmsg.ai{align-self:flex-start}
.cm-meta{display:flex;gap:6px;margin-top:5px}
.cm-tag{font-size:10px;line-height:1.6;padding:1px 6px;border-radius:var(--r-full);background:var(--blue-50b);color:var(--brand)}
.cm-tag.warn{background:var(--warn-bg);color:var(--warn-fg)}
.cm-tag.ghost{background:transparent;border:1px solid var(--border);color:var(--placeholder)}
.cmsg.typing{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;padding:9px 11px;border-radius:var(--r-4);background:var(--bg-2)}
.cmsg.typing .dot{width:5px;height:5px;border-radius:var(--r-full);background:var(--placeholder);animation:cpDot 1.1s infinite ease-in-out}
.cmsg.typing .dot:nth-child(2){animation-delay:.16s}
.cmsg.typing .dot:nth-child(3){animation-delay:.32s}
.cmsg.typing .typing-t{margin-left:4px;font-size:11px;color:var(--placeholder)}
@keyframes cpDot{0%,80%,100%{opacity:.28;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
.chat-empty{margin:auto;text-align:center;padding:16px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
.chat-empty .ce-ic{color:var(--border-2)}
.chat-empty h4{font-size:13px;font-weight:600;color:var(--ink)}
.chat-empty p{font-size:11px;line-height:1.7;color:var(--placeholder)}
.chat-sugs{display:flex;flex-direction:column;gap:6px;margin-top:8px;width:100%}
.chat-sugs .sug{padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-3);background:var(--bg-3);font-size:12px;color:var(--text);text-align:left}
.chat-sugs .sug:hover{border-color:var(--brand);color:var(--brand);background:var(--blue-50c)}
.chat-err{display:flex;align-items:flex-start;gap:6px;padding:8px 10px;border-radius:var(--r-3);background:var(--danger-bg);border:1px solid var(--danger-bd);font-size:11px;line-height:1.6;color:var(--danger-fg)}
.chat-err svg{flex:0 0 auto;margin-top:2px}
.snap{background:var(--bg-3);border:1px solid var(--border);border-radius:var(--r-3);padding:12px;font-size:12px;line-height:1.9;color:var(--text)}
.snap mark{background:var(--warn-bg);color:var(--warn-fg);border-radius:2px;padding:1px 2px;font-weight:600}
.snap .off{font-family:var(--font-en);font-size:11px;color:var(--placeholder)}
.srclist li{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px dashed var(--border-soft);font-size:12px}
.srclist li:first-child{border-top:0}
.srclist li .sp{flex:1;min-width:0;color:var(--text)}
.disclaimer{margin-top:auto;padding:12px 16px;background:var(--bg-3);border-top:1px solid var(--line);font-size:11px;line-height:1.7;color:var(--placeholder)}

/* ================= 4b · 申报条件（逐条自查） =================
   用户反馈「申请的相关条例不明确、没法直观看到自己想申请的政策」——
   以前每条是一整段长句，关键数字与办理路径全埋在文字里。
   现在每条一行、可勾选，关键数字高亮。 */
.condlist{gap:6px}
.clause-check{align-items:flex-start;gap:9px;padding:9px 10px;border:1px solid transparent;border-radius:var(--r-3);cursor:pointer;transition:background .12s,border-color .12s}
.clause-check:hover{background:var(--bg-3)}
.clause-check:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.clause-check .cbox{flex:0 0 auto;width:17px;height:17px;margin-top:1px;border:1.5px solid var(--border-2);border-radius:var(--r-1);display:grid;place-items:center;color:transparent;background:#fff;transition:background .12s,border-color .12s}
.clause-check .ctop{display:flex;align-items:baseline;gap:8px}
.clause-check .cshort{font-size:13px;font-weight:600;color:var(--ink)}
.clause-check .clabel{font-size:10px;color:var(--placeholder);opacity:0;transition:opacity .12s}
.clause-check:hover .clabel{opacity:1}
.clause-check .cfull{display:block;margin-top:3px;font-size:12px;line-height:1.7;color:var(--muted)}
.clause-check.on{background:var(--ok-bg);border-color:var(--ok-bd)}
.clause-check.on .cbox{border-color:var(--ok);background:var(--ok);color:#fff}
.clause-check.on .cshort{color:var(--ok-fg)}
.clause-check.on .clabel{opacity:0}
.clause-check.target{background:#FFFCF0;border-color:var(--warn-bd)}
.clause-check.target.on{background:var(--ok-bg);border-color:var(--ok-bd)}
mark.kn{background:transparent;color:var(--brand);font-weight:700;font-family:var(--font-en)}
.selfsum{font-size:11px;color:var(--placeholder)}
.selfsum.ok{color:var(--ok-fg);font-weight:600}
.condhint{padding:0 16px 12px;font-size:11px;line-height:1.6;color:var(--placeholder)}

/* ================= 4c · 申报流程 / 申报入口 ================= */
.steplist li{display:flex;gap:10px;padding-bottom:12px;position:relative}
.steplist li:last-child{padding-bottom:0}
.steplist li:not(:last-child)::before{content:"";position:absolute;left:10px;top:23px;bottom:2px;width:1px;background:var(--border)}
.steplist .sn{flex:0 0 auto;width:21px;height:21px;border-radius:var(--r-full);background:var(--blue-50b);color:var(--brand);display:grid;place-items:center;position:relative;z-index:1}
.steplist .sc{flex:1;min-width:0}
.steplist .st{font-size:13px;font-weight:600;color:var(--ink)}
.steplist .sd{margin-top:2px;font-size:12px;line-height:1.7;color:var(--muted)}
.chlist{gap:8px}
.chrow{display:flex;gap:10px;align-items:flex-start;font-size:12px;line-height:1.7}
.chrow .chk{flex:0 0 62px;color:var(--placeholder)}
.chrow .chv{flex:1;min-width:0;color:var(--text)}

/* ================= 4d · 原文快照弹层（原右栏内容） =================
   定位方式与 .cmp-mask 一致：画布带 transform:scale()，
   fixed 在变换祖先内按该祖先定位，正好铺满应用画面。 */
.snapdlg{position:fixed;inset:0;z-index:65;display:flex;align-items:center;justify-content:center;padding:48px}
.snapdlg[hidden]{display:none}
.snapdlg-mask{position:absolute;inset:0;background:rgba(15,23,42,.42)}
.snapdlg-panel{position:relative;width:min(660px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--card);border-radius:var(--r-3);box-shadow:0 24px 60px rgba(15,23,42,.24);overflow:hidden}
.snapdlg-panel > header{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);background:#FCFCFD}
.snapdlg-panel > header h3{font-size:14px;font-weight:600;color:var(--ink)}
.snapdlg-panel > header .spacer{flex:1}
.snapdlg-body{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:14px 16px}

/* ================= 5 · 简报预览与导出 ================= */
.brief-body{flex:1;min-height:0;display:flex;gap:20px;padding:18px 32px 20px}
.brief-side{flex:0 0 380px;display:flex;flex-direction:column;gap:14px}
.setbox{background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);padding:16px;display:flex;flex-direction:column;gap:14px}
.setbox h3{font-size:13px;font-weight:600;color:var(--ink)}
.setrow{display:flex;flex-direction:column;gap:8px}
.setrow .sl{font-size:12px;color:var(--placeholder)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .sg{height:34px;padding:0 14px;border-radius:var(--r-3);border:1px solid var(--border);background:var(--card);font-size:13px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg .sg:hover{border-color:var(--brand)}
.seg .sg.on{border-color:var(--brand);background:var(--blue-50c);color:var(--brand);font-weight:500}
.seg .sg.dis{opacity:.45;cursor:not-allowed}
.brief-preview{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:var(--r-5);display:flex;flex-direction:column;overflow:hidden}
.brief-preview > header{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:#FCFCFD;font-size:12px;color:var(--muted)}
.brief-preview > header .spacer{flex:1}
.paper{flex:1;min-height:0;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
.paper h2{font-size:17px;font-weight:700;color:var(--ink);text-align:center}
.paper .pmeta{font-size:11px;color:var(--placeholder);text-align:center;border-bottom:1px solid var(--line);padding-bottom:10px}
.pitem{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-3);background:#FCFDFF}
.pitem .pn{font-size:13px;font-weight:600;color:var(--ink)}
.pitem .pl{font-size:12px;color:var(--muted);line-height:1.7}
.pitem .pl b{color:var(--ink);font-weight:600}
.pitem .pl .sep{margin:0 6px;color:var(--border-2)}
.paper .pfoot{margin-top:auto;font-size:11px;color:var(--placeholder);border-top:1px solid var(--line);padding-top:10px;line-height:1.7}
/* 简报预览里的 AI 综述块与「预览只显示前 N 条」提示（导出文件里是全量） */
.paper .psum{display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#F5F9FF;border:1px solid #BFDBFE;border-radius:var(--r-3)}
.paper .psum .psum-h{font-size:12px;font-weight:600;color:var(--brand-link)}
.paper .psum p{margin:0;font-size:12px;color:var(--muted);line-height:1.8}
.paper .pcut{font-size:11px;color:var(--placeholder);text-align:center}
/* 预览空态：一条政策都没勾（或本次检索没有结果）时给提示，
   不再退回「演示政策」占位 —— 那会让人以为简报里真有那几条。 */
.paper.is-empty{justify-content:center;align-items:center;gap:10px;text-align:center}
.paper.is-empty .pempty-ic{width:44px;height:44px;border-radius:var(--r-full);background:var(--blue-50b);display:grid;place-items:center;color:var(--brand)}
.paper.is-empty h4{font-size:14px;font-weight:600;color:var(--ink)}
.paper.is-empty p{font-size:12px;color:var(--muted);max-width:430px;line-height:1.75;margin:0}

/* ================= 地域级联面板（首页筛选浮层） ================= */

/* 地域：三级级联（同一套 .fpanel 骨架，仅列表区排布不同） */
.casc-panel{width:680px}
.casc-panel .fpanel-body{flex-direction:row;border-top:1px solid var(--line)}
.casc-col{width:226px;height:412px;padding:8px;display:flex;flex-direction:column;min-width:0}
.casc-col + .casc-col{border-left:1px solid var(--line)}
.casc-col .col-ttl{
  display:flex;align-items:center;gap:8px;font-size:11px;color:var(--placeholder);
  padding:2px 4px 6px;flex:0 0 auto;
}
.casc-col .col-ttl .ct-t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 「选中全省」快捷操作：市级列标题右侧 */
.col-act{
  margin-left:auto;flex:0 0 auto;height:20px;padding:0 8px;border-radius:var(--r-full);
  border:1px solid var(--border);background:var(--card);font-size:11px;
  color:var(--brand-link);cursor:pointer;white-space:nowrap;
}
.col-act:hover{border-color:var(--brand);background:var(--blue-50c)}
.col-act.on{background:var(--blue-50b);border-color:var(--blue-50);color:var(--brand)}
.casc-list{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px}
.casc-note{flex:0 0 auto;font-size:11px;line-height:1.5;color:var(--placeholder);padding:6px 4px 2px}
.casc-switch{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--brand);cursor:pointer;flex:0 0 auto}
.casc-switch .sw{width:28px;height:16px;border-radius:var(--r-full);background:var(--bg-2);position:relative;transition:.2s}
.casc-switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:var(--r-full);background:#fff;box-shadow:var(--sh-1);transition:.2s}
.casc-switch.on .sw{background:var(--brand)}
.casc-switch.on .sw::after{left:14px}

/* ================= 10 · 登录 / 注册 / 账号 ================= */
.auth-body{flex:1;min-height:0;display:flex;gap:24px;padding:24px 32px 26px}

/* 左侧说明栏（品牌渐变） */
.auth-aside{
  flex:0 0 520px;min-width:0;border-radius:var(--r-6);padding:36px 34px;
  background:linear-gradient(150deg,#001745 0%,#04386F 55%,#014DB3 100%);
  color:#fff;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;
}
.auth-aside::after{content:"";position:absolute;right:-90px;top:-70px;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06)}
.auth-aside .aa-kicker{font-size:11px;letter-spacing:2px;color:#9DC0F0;position:relative}
.auth-aside h2{font-size:30px;line-height:1.25;font-weight:700;letter-spacing:-.4px;position:relative}
.auth-aside .aa-sub{font-size:13px;line-height:1.75;color:#C6D8F2;position:relative}
.auth-aside .aa-list{display:flex;flex-direction:column;gap:16px;margin-top:6px;position:relative}
.auth-aside .aa-list li{display:flex;gap:12px}
.auth-aside .pt-ic{flex:0 0 auto;width:34px;height:34px;border-radius:var(--r-3);display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}
.auth-aside .aa-list b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
.auth-aside .aa-list span{display:block;font-size:12px;line-height:1.6;color:#B7CCEC}
.auth-aside .aa-foot{
  margin-top:auto;display:flex;gap:8px;align-items:flex-start;font-size:11px;line-height:1.7;

.pf-bindacts{display:flex}
.pf-bindacts .is-busy{pointer-events:none}

.auth-head span{font-size:12px;color:var(--muted)}
.auth-form{flex:0 1 auto;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px}
.aff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.aff{display:flex;flex-direction:column;gap:6px;min-width:0}
.aff.wide{grid-column:1/-1}
.aff .aff-l{font-size:12px;color:var(--placeholder)}
.aff input{
  height:38px;padding:0 12px;border:1px solid var(--border-2);border-radius:var(--r-3);
  background:var(--card);font-size:13px;color:var(--text);outline:0;transition:.15s;
}
.aff input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(1,77,178,.1)}
.aff input::placeholder{color:var(--placeholder)}
.aff .aff-h{font-size:11px;color:var(--placeholder);line-height:1.5}
.auth-submit{width:100%;flex:0 0 auto}
.auth-err{
  display:none;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r-3);
  background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger-fg);font-size:12px;
}

.auth-switch{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex:0 0 auto}

.auth-forgot{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.auth-forgot .btn-link{font-size:12px}

.fg-coderow .aff{flex:1 1 auto;min-width:0}
.fg-send{flex:0 0 auto;height:36px;white-space:nowrap;margin-bottom:14px}

}

}

}

}

.ac-stat b{font-size:20px;font-weight:700;color:var(--ink)}
.none{color:var(--placeholder)}

.tb-guest{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto}
.tb-user.guest{margin-left:10px;border-color:var(--warn-bd);background:var(--warn-bg)}

}
.tb-drop:hover{border-color:var(--brand);color:var(--brand);background:var(--blue-50c)}

/* ================= 11 · 检索记录 ================= */
.hist-search{
  display:flex;align-items:center;gap:8px;flex:1;min-width:0;height:36px;padding:0 12px;

  display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);

.hc-top .hc-id{color:var(--placeholder)}
.hc-time{margin-left:auto;color:var(--placeholder)}
.hc-q{font-size:14px;font-weight:600;color:var(--ink);line-height:1.4}
.hc-cond{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.hc-cond svg{flex:0 0 auto;width:13px;height:13px;color:var(--brand)}
.hc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.hc-meta .dot-sep{color:var(--border-2)}
.hc-acts{flex:0 0 auto;display:flex;gap:8px}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:var(--danger-fg)}
.hist-foot{flex:0 0 auto;font-size:11px;color:var(--placeholder);padding-bottom:14px}

  const BACKEND_NS = [
    'stats', 'policies', 'regions', 'search', 'list',
    'detail', 'brief',
  ];

  const DATA = { FILES: UI_FILES, NS: UI_FILES.concat(BACKEND_NS) };

  /* ---------- 模板插值：fmt('已选 {n} 项', {n: 3}) ---------- */
  DATA.fmt = function (tpl, vars) {
    if (typeof tpl !== 'string') return tpl;
    return tpl.replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] !== undefined && vars[k] !== null ? vars[k] : m));
  };

  /* ---------- 深合并：把后端数据并入同名命名空间 ---------- */
  const isPlain = (o) => o && typeof o === 'object' && !Array.isArray(o);
  function deepMerge(base, patch) {
    if (!isPlain(patch)) return patch === undefined ? base : patch;
    const out = isPlain(base) ? Object.assign({}, base) : {};
    Object.keys(patch).forEach((k) => {
      const pv = patch[k];
      out[k] = isPlain(pv) && isPlain(out[k]) ? deepMerge(out[k], pv) : pv;
    });
    return out;
  }

  /* ---------- 便捷视图（派生量，随数据自动变化） ---------- */
  function rebuildViews() {
    DATA.policies = DATA.policies || {};
    DATA.regions = DATA.regions || {};
    DATA.brief = DATA.brief || {};

    const items = (DATA.policies.items || []);
    DATA.policyById = (id) => items.find((p) => p.id === id) || items[0];
    DATA.pickedPolicies = (ids) => (ids || []).map((id) => DATA.policyById(id));
    /* 简报预览与导出的清单由 screens-b.js → briefScopedPolicies() 决定：
       只取「已勾选」或「当前筛选结果」，**没有演示兜底** —— 一条都没有时预览显示空态。 */
    /* 某地域是否已有收录政策：以 policies[].regionCodes 为唯一数据源，驱动「仅显示已收录政策的地域」开关 */
    const cover = new Set();
    items.forEach((p) => (p.regionCodes || []).forEach((c) => cover.add(c)));
    DATA.regions.coverageCodes = cover;
    DATA.regions.hasPolicies = (node) => cover.has(node.code);
    return DATA;
  }

  /* ---------- 装配：UI 文案打底，后端数据按命名空间覆盖/补充 ---------- */
  function hydrate(ui, backend) {
    ui = ui || {};
    backend = backend || {};
    UI_FILES.forEach((k) => { DATA[k] = ui[k] || {}; });
    BACKEND_NS.forEach((k) => { DATA[k] = deepMerge(DATA[k] || {}, backend[k] || {}); });
    return rebuildViews();
  }

  /* ============================================================
     ★ 检索完成后回填：只并入新的后端数据，并重建派生视图。
       不动 UI 文案，也不需要重新拉取 data/*.json。
       入参 = 后端 /api/v1/searches/{id}/result 返回的 bootstrap（十命名空间子集）。
     ============================================================ */
  DATA.hydrateBackend = function (backend) {
    backend = backend || {};
    BACKEND_NS.forEach((k) => { DATA[k] = deepMerge(DATA[k] || {}, backend[k] || {}); });
    /* 灌进来的是一份新结果集 ⇒ 结果列表的勾选 / 页码 / 对比浮层归零。
       放在这里而不是各个调用点：发起检索、历史回放、启动回放三条路都走这个函数，
       少改一处就会出现「换个入口进来勾选数还留着」。函数实体在 screens-b.js。 */
    if (typeof resetListForNewResult === 'function') resetListForNewResult();
    return rebuildViews();
  };

  /* ---------- ① 装载前端文案与展示配置 ---------- */
  /* 用构建戳当缓存键：dev.html 是运行时 fetch data/*.json 的，浏览器/中间层
     一旦缓存住旧的 JSON，「改了文案刷新却看不到」就会反复出现。
     window.__BUILD__ 由 build.py 写进 dev.html，重建一次换一个值，缓存自然失效。 */
  function cacheBust() {
    const b = (typeof window !== 'undefined') && window.__BUILD__;
    return b ? '?v=' + encodeURIComponent(b) : '';
  }
  function loadUI() {
    if (window.__DATA__) return Promise.resolve(window.__DATA__);
    const q = cacheBust();
    return Promise.all(UI_FILES.map((k) => fetch('data/' + k + '.json' + q).then((r) => {
      if (!r.ok) throw new Error('数据文件读取失败（HTTP ' + r.status + '）：data/' + k + '.json');
      return r.json();
    }))).then((list) => {
      const raw = {};
      UI_FILES.forEach((k, i) => { raw[k] = list[i]; });
      return raw;
    });
  }

  /* ============================================================
     检索服务「基地址」解析
     ------------------------------------------------------------
     被后端 serve（http/https 同源）时，相对路径最自然；但**单文件双击（file://）
     或另起静态服务器**打开时，同源根本没有后端 —— 于是点「开始检索」就
     「检索接口不可用（Failed to fetch）」降级到本地演示。这里一次性探好基地址：
       ① window.POLICY_AGENT_API_BASE / ?api=http://host:port（显式指定，最高优先）
       ② 同源 ''（后端 serve 时命中）
       ③ http://127.0.0.1:8000（本机默认后端端口，file:// 打开时命中）
     选中第一个能拿到 /api/bootstrap 的基地址并缓存，之后所有 API 都带上它。
     ============================================================ */
  function candidateBases() {
    let explicit = '';
    try { explicit = String((window.POLICY_AGENT_API_BASE || '')).trim(); } catch (e) { /* ignore */ }
    try {
      if (!explicit && typeof location !== 'undefined' && location.search) {
        const q = new URLSearchParams(location.search).get('api');
        if (q) explicit = String(q).trim();
      }
    } catch (e) { /* ignore */ }
    if (explicit) return [explicit.replace(/\/+$/, '')];
    const out = [];
    let proto = '';
    try { proto = (typeof location !== 'undefined' && location.protocol) || ''; } catch (e) { /* ignore */ }
    if (proto === 'http:' || proto === 'https:') out.push('');
    out.push('http://127.0.0.1:8000');
    return out;
  }

  let _apiBase = null;
  function resolveApiBase() {
    if (_apiBase !== null) return Promise.resolve(_apiBase);
    if (typeof fetch !== 'function') { _apiBase = ''; return Promise.resolve(''); }
    const bases = candidateBases();
    let chain = Promise.resolve(null);
    bases.forEach((base) => {
      chain = chain.then((found) => {
        if (found !== null) return found;
        return fetch(base + '/api/bootstrap', { headers: { Accept: 'application/json' } })
          .then((r) => (r && r.ok ? base : null))
          .catch(() => null);
      });
    });
    return chain.then((base) => { _apiBase = (base === null ? '' : base); return _apiBase; });
  }

  /* ============================================================
     ★ 后端数据接入点
     ------------------------------------------------------------
     优先级：
       ① 单文件构建版：window.TEST_DATA 已内联 → 直接可用（同步装配）；
       ② 后端在线：GET /api/bootstrap（本地 FastAPI 后端，见 deliverables/backend）；
       ③ 后端不可用：降级动态注入 test_date.js —— 保证离线/未起后端时也不白屏。
     ②的返回值与 TEST_DATA 的十个命名空间同构，故渲染层无需改动。
     ============================================================ */
  function loadBackend() {
    /* ① 单文件构建版：内联数据直接可用 */
    if (window.TEST_DATA) return Promise.resolve(window.TEST_DATA);

    /* ③ 降级：注入 test_date.js（后端不可用 / 无 fetch 环境） */
    const injectTestData = (cause) => new Promise((resolve, reject) => {
      if (window.console && console.warn) {
        console.warn('[data.js] 后端不可用，降级使用 test_date.js：', cause && cause.message);
      }
      const s = document.createElement('script');
      s.src = 'test_date.js';
      s.onload = () => (window.TEST_DATA
        ? resolve(window.TEST_DATA)
        : reject(new Error('test_date.js 未提供 window.TEST_DATA')));
      s.onerror = () => reject(new Error(
        '后端不可用，且降级数据 test_date.js 亦缺失：' + (cause && cause.message ? cause.message : cause)));
      document.head.appendChild(s);
    });

    /* ② 后端在线：请求本地后端 GET /api/bootstrap（基地址可能是同源，也可能是本机默认端口） */
    if (typeof fetch !== 'function') return injectTestData(new Error('当前环境不支持 fetch'));
    return resolveApiBase()
      .then((base) => fetch(base + '/api/bootstrap'))
      .then((r) => {
        if (!r.ok) throw new Error('bootstrap 接口返回 HTTP ' + r.status);
        return r.json();
      })
      .then((data) => {
        if (!data || typeof data !== 'object') throw new Error('bootstrap 返回体非法');
        return data;
      })
      .catch((err) => injectTestData(err));
  }

  /* ---------- 装载 ---------- */
  DATA.load = function () {
    /* 内联双数据（单文件版）→ 同步装配，首屏无需等待微任务 */
    if (window.__DATA__ && window.TEST_DATA) {
      return Promise.resolve(hydrate(window.__DATA__, window.TEST_DATA));
    }
    return Promise.all([loadUI(), loadBackend()]).then(([ui, be]) => hydrate(ui, be));
  };

  /* ============================================================
     检索接口客户端 —— 前端唯一与「检索服务」对话的入口
     （对应后端 deliverables/backend/app/search.py）
     ============================================================ */
  function request(url, opts) {
    if (typeof fetch !== 'function') {
      return Promise.reject(new Error('当前环境不支持 fetch'));
    }
    return resolveApiBase()
      .then((base) => fetch(base + url, opts))
      .then((r) => r.json().catch(() => null).then((body) => {
        if (!r.ok) {
          const detail = (body && body.error) || {};
          const err = new Error(detail.message || ('HTTP ' + r.status));
          err.status = r.status;
          err.code = detail.code;
          throw err;
        }
        return body;
      }));
  }

  /* ============================================================
     登录凭证：登录/注册拿到 Bearer Token 后由 AUTH 统一注入请求头。
     （Token 明文只存在于浏览器本地；服务端库里只存 SHA-256 摘要）
     ============================================================ */
  let _token = null;

  function authHeaders(extra) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, extra || {});
    if (_token) headers.Authorization = 'Bearer ' + _token;
    return headers;
  }

  const json = (payload) => JSON.stringify(payload || {});

  DATA.api = {
    /* ---------- 登录凭证 ---------- */
    setToken(t) { _token = t || null; return _token; },
    getToken() { return _token; },
    isSignedIn() { return !!_token; },

    /* ---------- 账号体系（MySQL users / sessions） ---------- */
    register(payload) {
      return request('/api/v1/auth/register', {
        method: 'POST', headers: authHeaders(), body: json(payload),
      });
    },
    login(payload) {
      return request('/api/v1/auth/login', {
        method: 'POST', headers: authHeaders(), body: json(payload),
      });
    },
    logout() {
      return request('/api/v1/auth/logout', { method: 'POST', headers: authHeaders() });
    },
    me() {
      return request('/api/v1/auth/me', { headers: authHeaders() });
    },
    updateProfile(patch) {
      return request('/api/v1/auth/profile', {
        method: 'PATCH', headers: authHeaders(), body: json(patch),
      });
    },
    sendBindCode(email) {
      return request('/api/v1/auth/profile/email-code', {
        method: 'POST', headers: authHeaders(), body: json({ email }),
      });
    },
    changePassword(body) {
      return request('/api/v1/auth/password', {
        method: 'POST', headers: authHeaders(), body: json(body),
      });
    },
    /* 忘记密码：下发验证码（原型直接返回 code）→ 验证码重置 */
    forgotPassword(account) {
      return request('/api/v1/auth/forgot', {
        method: 'POST', headers: authHeaders(), body: json({ account: account }),
      });
    },
    resetPassword(payload) {
      return request('/api/v1/auth/reset', {
        method: 'POST', headers: authHeaders(), body: json(payload),
      });
    },
    dbStatus() {
      return request('/api/v1/db/status');
    },

    /* ---------- 检索记录（MySQL search_records） ---------- */
    history(opts) {
      const o = opts || {};
      const q = [];
      if (o.limit != null) q.push('limit=' + encodeURIComponent(o.limit));
      if (o.offset != null) q.push('offset=' + encodeURIComponent(o.offset));
      if (o.keyword) q.push('keyword=' + encodeURIComponent(o.keyword));
      return request('/api/v1/history' + (q.length ? '?' + q.join('&') : ''),
        { headers: authHeaders() });
    },
    historyDetail(id) {
      return request('/api/v1/history/' + encodeURIComponent(id), { headers: authHeaders() });
    },
    deleteHistory(id) {
      return request('/api/v1/history/' + encodeURIComponent(id),
        { method: 'DELETE', headers: authHeaders() });
    },
    clearHistory() {
      return request('/api/v1/history', { method: 'DELETE', headers: authHeaders() });
    },

    /* ---------- 检索链路 ---------- */
    /* 发起检索：{ query, regions[], industries, types, deadline } → { taskId, status, ... }
       带凭证时后端会把条件与结果落库，下次登录可直接回放。 */
    startSearch(payload) {
      return request('/api/v1/searches', {
        method: 'POST',
        headers: authHeaders(),
        body: json(payload),
      });
    },
    /* 轮询进度：步骤 / 源进度 / 抓取日志 / 已解析条件 */
    searchStatus(taskId) {
      return request('/api/v1/searches/' + encodeURIComponent(taskId), { headers: authHeaders() });
    },
    /* 取结果：{ bootstrap: { 十命名空间 } } */
    searchResult(taskId) {
      return request('/api/v1/searches/' + encodeURIComponent(taskId) + '/result',
        { headers: authHeaders() });
    },
    /* 取消检索 */
    cancelSearch(taskId) {
      return request('/api/v1/searches/' + encodeURIComponent(taskId),
        { method: 'DELETE', headers: authHeaders() });
    },
    /* 当前大模型接入状态（本地免费引擎 / 云端模型） */
    llmStatus() {
      return request('/api/v1/llm/status');
    },

    /* ---------- 政策简报（真实文件：XLSX / DOCX / PDF） ----------
       清单由前端把「已勾选 / 当前结果集」的结构化政策原样交给后端拼装
       （不经模型改写、不会漏条目）；综述由后端调大模型写，超时自动降级。
       返回 { briefId, fileName, downloadUrl, mediaType, bytes, count, summary, … }。 */
    createBrief(payload) {
      return request('/api/v1/briefs', {
        method: 'POST', headers: authHeaders(), body: json(payload),
      });
    },
    /* 下载成 Blob 交给浏览器另存（走 resolveApiBase，单文件/静态服务打开也能下载） */
    downloadBrief(info) {
      const id = (info && info.briefId) || '';
      const path = (info && info.downloadUrl) || ('/api/v1/briefs/' + encodeURIComponent(id) + '/download');
      if (typeof fetch !== 'function') {
        return Promise.reject(new Error('当前环境不支持 fetch'));
      }
      return resolveApiBase()
        .then((base) => fetch(base + path))
        .then(async (r) => {
          if (!r.ok) {
            /* 404 = 简报文件已被清理。后端的可读文案（BRIEF_MISSING）必须透传给 UI，
               不能吞成「HTTP 404」—— 以前就是这么吞的，用户不知道该重新生成（2026-10-16）。 */
            const body = await r.json().catch(() => null);
            const detail = (body && body.error) || {};
            const err = new Error(detail.message || ('HTTP ' + r.status));
            err.status = r.status;
            err.code = detail.code;
            throw err;
          }
          return r.blob();
        });
    },
    /* 在系统文件管理器里定位刚生成的简报 */
    revealBrief(briefId) {
      return request('/api/v1/briefs/' + encodeURIComponent(briefId) + '/reveal',
        { method: 'POST', headers: authHeaders() });
    },
    /* 能力探测（PDF 是否可用 / 输出目录） */
    briefStatus() {
      return request('/api/v1/briefs/status');
    },

    /* ---------- 政策对话（MySQL chat_messages） ----------
       详情页右栏「问政策」：把当前这条政策作为事实底座交给后端，
       后端调大模型（不可用/超时就改用规则回答）并落库。
       带上 Bearer 时后端会把一问一答写进 chat_messages，下次打开这条政策接着聊；
       游客没有凭证 → 后端不落库，响应里的 saved 会是 false（前端据此给提示）。 */
    chatSend(payload) {
      return request('/api/v1/chat/messages', {
        method: 'POST', headers: authHeaders(), body: json(payload),
      });
    },
    chatHistory(policyId, limit) {
      const q = ['policyId=' + encodeURIComponent(policyId || '')];
      if (limit != null) q.push('limit=' + encodeURIComponent(limit));
      return request('/api/v1/chat/messages?' + q.join('&'), { headers: authHeaders() });
    },
    /* 不带 policyId → 按政策聚合的会话列表（检索记录屏「对话记录」页用） */
    chatThreads() {
      return request('/api/v1/chat/messages', { headers: authHeaders() });
    },
    chatClear(policyId) {
      return request('/api/v1/chat/messages?policyId=' + encodeURIComponent(policyId || ''),
        { method: 'DELETE', headers: authHeaders() });
    },
    chatStatus() {
      return request('/api/v1/chat/status');
    },
  };

  DATA.loadUI = loadUI;
  DATA.loadBackend = loadBackend;
  DATA.deepMerge = deepMerge;
  DATA.request = request;
  /* 简报下载要自己拼绝对地址（走 Blob 另存），所以把基地址解析也暴露出去 */
  DATA.resolveApiBase = resolveApiBase;
  DATA.apiUrl = (path) => resolveApiBase().then((base) => base + path);

  return DATA;
})();

/* ==== cascade.js ==== */
/* ============================================================
   地域三级级联多选（Cascader × Multi-Select）
   ------------------------------------------------------------
   数据来源：DATA.regions
     · tree     —— [code, name, py首字母, children|null]，首项「全国（不限）」
     · defaults —— expandPath（默认展开）/ applied（默认已选，按名称路径）

   语义：
   · 每级独立勾选：勾省 = 「全省」这一个条件，**不下沉点亮**地级市 / 区县；
     勾市、勾区县同理，只代表它自己。三列之间没有任何联动。
     （设计稿 S7 原来的「选省自动携带下辖市 + 子级取消后父级转半选」已按产品要求取消）
   · 「全国（不限）」与任何具体地域互斥
   · 多选不限层级，多个条件按 OR 生效，与「政策层级」筛选互相独立
   · 每级独立滚动 + 名称 / 拼音首字母搜索
   · 超过 4 项折叠为「+N」
   · 未选即「全国（不限）」
   · 勾选只更新草稿与计数，点「确定」后才生效
   ============================================================ */
const CASCADE = (function () {
  const NATION = '00';
  let index = new Map();     // code -> {code,name,py,children,parent,level}
  let provinces = [];        // 一级（含「全国（不限）」）

  function walk(list, parent, level) {
    return list.map(([code, name, py, children]) => {
      const node = { code, name, py: py || '', children: null, parent, level };
      index.set(code, node);            // 先注册父级，保证遍历顺序 = 树的前序
      if (level === 1) provinces.push(node);
      node.children = children ? walk(children, node, level + 1) : null;
      return node;
    });
  }

  const self = {
    NATION,
    /* ---------- 初始化（由 app.js 在数据就绪后调用） ---------- */
    init(tree, defaults) {
      index = new Map();
      provinces = [];
      walk(tree || [], null, 1);
      self.index = index;
      self.provinces = provinces;
      /* 省级列表（去掉默认项） */
      self.provinceList = provinces.filter((p) => p.code !== NATION);

      const d = defaults || {};
      const path = d.expandPath || [];
      self.activeProvince = (path[0] && self.provinceList.find((p) => p.name === path[0])) || self.provinceList[0];
      const kids = (self.activeProvince && self.activeProvince.children) || [];
      self.activeCity = (path[1] && kids.find((c) => c.name === path[1])) || kids[0] || null;

      /* 默认已选：按「名称路径」精确解析，避免同名区县歧义 */
      self.applied = new Set();
      self.draft = new Set();
      (d.applied || []).forEach((p) => {
        const node = self.resolvePath(p);
        if (node) { self.applied.add(node.code); self.draft.add(node.code); }
      });
      return self;
    },
    /** 按名称路径逐级解析节点，如 ['浙江省','杭州市','滨江区'] */
    resolvePath(path) {
      let list = provinces;
      let node = null;
      for (const name of (path || [])) {
        node = (list || []).find((n) => n.name === name) || null;
        if (!node) return null;
        list = node.children;
      }
      return node;
    },
    /* ---------- 状态 ---------- */
    draft: new Set(),      // 草稿选择（面板内）
    applied: new Set(),    // 已生效（触发框）
    index,
    provinces,
    node: (code) => index.get(code),
    /* ---------- 基础判定 ---------- */
    isExplicit(code) { return self.draft.has(code); },
    /** 'on' | 'off' —— 每级独立，不看祖先也不看子级（已无「半选态」） */
    stateOf(code) {
      if (!index.get(code)) return 'off';
      return self.draft.has(code) ? 'on' : 'off';
    },
    /* ---------- 勾选 ---------- */
    toggle(code) {
      if (code === NATION) {
        if (self.draft.has(NATION)) self.draft.clear();
        else { self.draft.clear(); self.draft.add(NATION); }
        return;
      }
      self.draft.delete(NATION);                    // 与「全国（不限）」互斥
      /* 只切自己：不牵连子级，也不动祖先 */
      if (self.draft.has(code)) self.draft.delete(code);
      else self.draft.add(code);
    },
    /** 全选 / 取消全选本级（某列的所有可见兄弟） */
    toggleAll(list) {
      const allOn = list.every((n2) => self.draft.has(n2.code));
      if (allOn) list.forEach((n2) => self.draft.delete(n2.code));
      else { self.draft.delete(NATION); list.forEach((n2) => self.draft.add(n2.code)); }
    },
    /**
     * 「选中全省」快捷操作（市级列标题旁）：一键勾上**当前展开省**下全部地级市。
     *
     *   为什么不直接点省名？点省名 = 「全省」这一个条件（语义等价，但只占 1 行、无法回看下辖有谁）；
     *   本操作是替用户把下辖市逐个点亮，省名自身是否勾选**不受影响** —— 纯增量，
     *   不会悄悄改掉用户已经做过的选择。全部已勾时再点即整体取消。
     * @returns {{allOn:boolean, n:number}} 操作前的状态与受影响的市级数量
     */
    toggleProvinceAll() {
      const p = self.activeProvince;
      const kids = (p && p.children) || [];
      if (!kids.length) return { allOn: false, n: 0 };
      const allOn = kids.every((c) => self.draft.has(c.code));
      if (allOn) kids.forEach((c) => self.draft.delete(c.code));
      else { self.draft.delete(NATION); kids.forEach((c) => self.draft.add(c.code)); }
      return { allOn, n: kids.length };
    },
    /** 当前展开省下辖市是否已全部在草稿里（驱动「选中全省 / 取消全省」文案） */
    provinceAllOn() {
      const kids = (self.activeProvince && self.activeProvince.children) || [];
      return !!kids.length && kids.every((c) => self.draft.has(c.code));
    },
    clear() { self.draft.clear(); },
    /** 草稿 → 生效 */
    commit() { self.applied = new Set(self.draft); return self.applied; },
    resetFromApplied() { self.draft = new Set(self.applied); },
    /* ---------- 已选（芯片 & 计数） ---------- */
    selectedNodes(draft) {
      const src = draft ? self.draft : self.applied;
      const out = [];
      index.forEach((n) => {
        if (n.code === NATION) return;
        if (src.has(n.code)) out.push(n);
      });
      return out;
    },
    count(draft) { return self.selectedNodes(draft).length; },
    summaryText(draft) {
      const list = self.selectedNodes(draft);
      if (!list.length) return '全国（不限）';
      return list.map((n) => n.name).join(' / ');
    },
    /* ---------- 搜索 ---------- */
    match(node, q) {
      if (!q) return true;
      const s = q.trim();
      if (!s) return true;
      if (node.name.indexOf(s) >= 0) return true;
      if (/^[a-zA-Z]+$/.test(s)) return node.py.toUpperCase().indexOf(s.toUpperCase()) === 0;
      return false;
    },
    /** 在当前列表里过滤；同时返回命中的相邻层级 */
    filterLevel(list, q) { return q ? list.filter((n) => self.match(n, q)) : list; },
  };

  return self;
})();

/* ==== screens-a.js ==== */
/* ============================================================
   屏幕渲染 · 公共件 + 1 首页检索 + 2 检索中
   —— 全部文案与字段取自 DATA.*（data/*.json），本文件只保留视图逻辑
   ============================================================ */

/* ---------- 产品顶栏 ---------- */
function topBar(active) {
  const A = DATA.app;
  /* 闸门未开（未登录且未选「游客身份」）时，站在登录页上的用户点导航只会被拦回来 ——
     与其「点了没反应」，不如明确置灰。账号区不停用（它就是登录入口）。 */
  const locked = typeof AUTH !== 'undefined' && typeof AUTH.gateOpen === 'function' && !AUTH.gateOpen();
  const gateTip = (typeof escHtml === 'function' && DATA.auth) ? escHtml(DATA.auth.gate.hint) : '';
  const lock = locked ? ` disabled title="${gateTip}"` : '';
  const nav = A.nav.map((n) =>
    `<button data-nav="${n.screen}" class="${n.key === active ? 'on' : ''}"${lock}>${n.label}</button>`).join('');
  /* 账号区由 src/screens-d.js 提供；缺失时退回静态文案 */
  const account = (typeof authChip === 'function')
    ? authChip()
    : `<span class="tb-pill">${A.brand.pill}</span>`;
  /* 状态胶囊：只作状态展示（原「异常降级」跳转入口已随该屏一起移除） */
  const status = `<span class="tb-status" id="tbStatus" title="${A.status.title}"><span class="dot"></span>${A.status.text}</span>`;
  return `
  <header class="topbar">
    <div class="tb-logo">
      <span class="mark">${ICON.logo}</span>
